name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the result you want, not only the feature.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Contsy accepts SFW features only (see CONTRIBUTING.md).
